<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Downloader</title>
  <style>
    body {
      font-family: Inter, system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: #020617;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      text-align: center;
    }
    p {
      font-size: 14px;
      color: #cbd5f5;
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    .result {
      margin-top: 20px;
      display: none;
    }
    .result img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .links a {
      display: block;
      text-align: center;
      padding: 10px;
      margin-bottom: 8px;
      background: #1e293b;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .links a:hover { background: #334155; }
    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎵 TikTok Downloader</h1>
    <p>Download video TikTok tanpa watermark</p><input id="url" type="text" placeholder="Paste link TikTok di sini" />
<button onclick="download()">Download</button>

<div id="result" class="result">
  <img id="thumb" />
  <h3 id="title"></h3>
  <div class="links">
    <a id="sd" target="_blank">⬇️ Download Video SD</a>
    <a id="hd" target="_blank">⬇️ Download Video HD</a>
    <a id="mp3" target="_blank">🎧 Download MP3</a>
  </div>
</div>

<div class="footer">Powered by AanzDigital API</div>

  </div>  <script>
    async function download() {
      const url = document.getElementById('url').value.trim();
      if (!url) return alert('Masukkan URL TikTok');

      const api = `https://aan-rest-api.vercel.app/download/tiktok?apikey=aan&url=${encodeURIComponent(url)}`;

      try {
        const res = await fetch(api);
        const json = await res.json();
        if (!json.status) return alert('Gagal mengambil data');

        const r = json.result;
        document.getElementById('thumb').src = r.thumbnail;
        document.getElementById('title').innerText = r.title;
        document.getElementById('sd').href = r.video_sd;
        document.getElementById('hd').href = r.video_hd;
        document.getElementById('mp3').href = r.mp3;
        document.getElementById('result').style.display = 'block';
      } catch (e) {
        alert('Terjadi kesalahan');
      }
    }
  </script></body>
</html>
